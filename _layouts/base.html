<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body class="{{ page.body_class }}">

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      {{ content }}
    </main>

    {%- include footer.html -%}

    {%- assign t = site.data.i18n[page.lang] | default: site.data.i18n.en -%}
    <dialog class="lightbox" id="lightbox">
      <button type="button" class="lightbox-close" aria-label="{{ t.portfolio.close }}">×</button>
      <figure>
        <img alt="">
        <figcaption></figcaption>
      </figure>
    </dialog>

    <script src="{{ "/assets/js/site.js" | relative_url }}" defer></script>

  </body>

</html>
