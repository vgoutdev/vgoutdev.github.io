# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: VG OutDev
tagline: Transforming ideas...
logo: /assets/img/logo4.PNG
email: vgoutdev@outlook.com
# Contact form delivery (https://web3forms.com). Get a free access key by entering
# vgoutdev@outlook.com on their site; messages are emailed to that address.
# The key is safe to publish - it can only send mail to you.
web3forms_key: "bf3497ce-704b-42cf-bc0a-f1da4f3a4bc7"
description: >- # this means to ignore newlines until "baseurl:"
  We design, build and maintain web and mobile applications, and extend your team with experienced developers, testers and support engineers.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://vgoutdev.com" # the base hostname & protocol for your site, e.g. http://example.com
twitter_username: vgoutdev
github_username:  vgoutdev

# Site languages, in the order shown in the language menu. English lives at /,
# the others under /ro/, /fr/, ... All page text is in _data/i18n/<lang>.yml.
lang: en
languages: [en, ro, fr, it, es]


# Build settings
theme: minima
plugins:
  - jekyll-seo-tag

# Privacy policies and the account deletion page get the "legal" layout.
# Their URLs are linked from the app stores, so do not rename these files.
defaults:
  - scope: { path: "" }
    values: { lang: en }
  - scope: { path: "ro" }
    values: { lang: ro }
  - scope: { path: "fr" }
    values: { lang: fr }
  - scope: { path: "it" }
    values: { lang: it }
  - scope: { path: "es" }
    values: { lang: es }
  - scope: { path: "*_terms.markdown" }
    values: { layout: legal }
  - scope: { path: "pop_it_simple.markdown" }
    values: { layout: legal }
  - scope: { path: "account_deletion_drugal.markdown" }
    values: { layout: legal, lang: ro }

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
#
exclude:
  - README
  - preview.ps1
  - preview.cmd
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
