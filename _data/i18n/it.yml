about:
  eyebrow: Chi siamo
  lead: Un’azienda di sviluppo software e outsourcing che trasforma le idee in software affidabile.
  intro:
    - VG OutDev è un’azienda di sviluppo software e outsourcing IT, fondata nel 2023 e basata su due principi, <strong>la qualità</strong> e <strong>l’attenzione al cliente</strong>.
    - Il nostro team porta l’esperienza maturata lavorando accanto a grandi professionisti del settore IT. La mettiamo al servizio di progetti di ogni dimensione, da una singola app mobile agli strumenti su cui gira tutta la tua azienda.
  values_title: In cosa crediamo
  values:
    - title: Comunicazione chiara
      text: Sai sempre cosa stiamo sviluppando, quando e quanto costa.
    - title: Qualità, non scorciatoie
      text: Codice pulito, testato e manutenibile, che continua a funzionare dopo il lancio.
    - title: Privacy by design
      text: Raccogliamo meno dati possibile e sviluppiamo allo stesso modo per i nostri clienti.
    - title: Collaborazioni durature
      text: Preferiamo essere il team che chiami per il prossimo progetto piuttosto che un fornitore occasionale.

