faq:
  eyebrow: FAQ
  title: Domande frequenti
  items:
    - q: Come inizia un progetto?
      a: Inviaci una breve descrizione di ciò che ti serve. Ti rispondiamo con alcune domande e poi con una proposta che include perimetro, tempi e costi. La prima consulenza è gratuita.
    - q: Lavorate con piccole aziende e startup?
      a: Sì. Lavoriamo a progetti di ogni dimensione, da una singola app o funzionalità a collaborazioni a lungo termine.
    - q: Potete entrare nel nostro team?
      a: Sì. Con il modello di outsourcing, i nostri sviluppatori, tester e tecnici di supporto lavorano all’interno dei tuoi processi, usando i tuoi repository, il tuo sistema di task e i tuoi strumenti di comunicazione.
    - q: A chi appartiene il codice?
      a: A te. Una volta pagato il progetto, il codice sorgente e tutti i diritti su di esso sono tuoi.
    - q: Cosa succede dopo il lancio?
      a: Possiamo continuare a mantenere il prodotto, con correzioni, aggiornamenti per le nuove versioni di Android e dei browser, adeguamenti alle policy degli store e nuove funzionalità.
    - q: Come gestite privacy e dati?
      a: Integriamo la privacy fin dall’inizio. Raccogliamo meno dati possibile e applichiamo i requisiti del GDPR al software che sviluppiamo per i clienti.

