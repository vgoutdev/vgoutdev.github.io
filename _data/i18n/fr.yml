faq:
  eyebrow: FAQ
  title: Questions fréquentes
  items:
    - q: Comment démarre un projet ?
      a: Envoyez-nous une courte description de votre besoin. Nous revenons vers vous avec des questions, puis une proposition avec périmètre, planning et coût. La première consultation est gratuite.
    - q: Travaillez-vous avec les petites entreprises et les startups ?
      a: Oui. Nous travaillons sur des projets de toutes tailles, d’une simple application à des partenariats à long terme.
    - q: Pouvez-vous rejoindre notre équipe existante ?
      a: Oui. Avec notre modèle d’externalisation, nos développeurs, testeurs et ingénieurs support travaillent dans vos processus, avec vos dépôts, votre outil de suivi et vos outils de communication.
    - q: À qui appartient le code ?
      a: À vous. Une fois le projet payé, le code source et tous les droits associés vous appartiennent.
    - q: Que se passe-t-il après le lancement ?
      a: Nous pouvons continuer à maintenir le produit, avec des corrections, des mises à jour pour les nouvelles versions d’Android et des navigateurs, les changements de règles des stores et de nouvelles fonctionnalités.
    - q: Comment gérez-vous la confidentialité et les données ?
      a: Nous intégrons la confidentialité dès la conception. Nous collectons le moins de données possible et appliquons les exigences du RGPD aux logiciels que nous créons pour nos clients.

