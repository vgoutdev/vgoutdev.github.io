about:
  eyebrow: Qui sommes-nous
  lead: Une entreprise de développement logiciel et d’externalisation qui transforme les idées en logiciels fiables.
  intro:
    - VG OutDev est une entreprise de développement logiciel et d’externalisation IT, fondée en 2023 et bâtie sur deux piliers, <strong>la qualité</strong> et <strong>l’attention portée au client</strong>.
