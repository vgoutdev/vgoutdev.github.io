faq:
  eyebrow: Preguntas frecuentes
  title: Preguntas frecuentes
  items:
    - q: ¿Cómo empieza un proyecto?
      a: Envíanos una breve descripción de lo que necesitas. Te respondemos con preguntas y luego con una propuesta con alcance, calendario y coste. La primera consulta es gratuita.
    - q: ¿Trabajáis con pequeñas empresas y startups?
      a: Sí. Trabajamos en proyectos de cualquier tamaño, desde una sola app o funcionalidad hasta colaboraciones a largo plazo.
    - q: ¿Podéis uniros a nuestro equipo?
      a: Sí. Con nuestro modelo de outsourcing, nuestros desarrolladores, testers e ingenieros de soporte trabajan dentro de tu proceso, usando tus repositorios, tu gestor de tareas y tus herramientas de comunicación.
    - q: ¿De quién es el código?
      a: Tuyo. Una vez pagado el proyecto, el código fuente y todos sus derechos te pertenecen.
    - q: ¿Qué pasa después del lanzamiento?
      a: Podemos seguir manteniendo el producto, con correcciones, actualizaciones para nuevas versiones de Android y navegadores, cambios en las políticas de las tiendas y nuevas funcionalidades.
    - q: ¿Cómo tratáis la privacidad y los datos?
      a: Integramos la privacidad desde el principio. Recogemos los mínimos datos posibles y aplicamos los requisitos del RGPD al software que creamos para nuestros clientes.

