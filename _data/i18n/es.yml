  lead: Una empresa de desarrollo de software y outsourcing que convierte ideas en software fiable.
  intro:
    - VG OutDev es una empresa de desarrollo de software y outsourcing IT, fundada en 2023 y basada en dos pilares, <strong>la calidad</strong> y <strong>la atención al cliente</strong>.
