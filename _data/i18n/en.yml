faq:
  eyebrow: FAQ
  title: Frequently asked questions
  items:
    - q: How does a project start?
      a: Send us a short description of what you need. We reply with questions, then a proposal with scope, timeline and cost. The first consultation is free.
    - q: Do you work with small companies and startups?
      a: Yes. We work on projects of every size, from a single app or feature to long-term development partnerships.
    - q: Can you join our existing team?
      a: Yes. With our outsourcing model, our developers, testers and support engineers work inside your process, using your repositories, task tracker and communication tools.
    - q: Who owns the code?
      a: You do. Once the project is paid for, the source code and all rights to it belong to you.
    - q: What happens after launch?
      a: We can keep maintaining the product, with fixes, updates for new Android and browser versions, store policy changes and new features.
    - q: How do you handle privacy and data?
      a: We build privacy in from the start. We collect as little data as possible and apply GDPR requirements to the software we build for clients.

