faq:
  eyebrow: Întrebări frecvente
  title: Întrebări frecvente
  items:
    - q: Cum începe un proiect?
      a: Trimite-ne o scurtă descriere a ceea ce îți dorești. Îți răspundem cu întrebări, apoi cu o ofertă care include scopul, calendarul și costul. Prima consultanță este gratuită.
    - q: Lucrați cu firme mici și startup-uri?
      a: Da. Lucrăm la proiecte de orice dimensiune, de la o singură aplicație sau funcționalitate la parteneriate pe termen lung.
    - q: Vă puteți alătura echipei noastre?
      a: Da. Prin modelul de outsourcing, programatorii, testerii și inginerii noștri de suport lucrează în procesul tău, folosind depozitele de cod, sistemul de task-uri și instrumentele tale de comunicare.
    - q: Cui îi aparține codul?
      a: Ție. După plata proiectului, codul sursă și toate drepturile asupra lui îți aparțin.
    - q: Ce se întâmplă după lansare?
      a: Putem continua mentenanța produsului, cu remedieri, actualizări pentru versiuni noi de Android și browsere, modificări ale politicilor magazinelor și funcționalități noi.
    - q: Cum tratați confidențialitatea și datele?
      a: Integrăm confidențialitatea de la început. Colectăm cât mai puține date și aplicăm cerințele GDPR în software-ul pe care îl construim pentru clienți.

