about:
  eyebrow: Cine suntem
  lead: O companie de dezvoltare software și outsourcing care transformă ideile în software de încredere.
  intro:
    - VG OutDev este o companie de dezvoltare software și outsourcing IT, fondată în 2023 și construită pe două principii, <strong>calitatea</strong> și <strong>grija față de client</strong>.
    - Echipa noastră aduce experiența câștigată lucrând alături de profesioniști de top din industria IT. O punem în slujba proiectelor de orice dimensiune, de la o singură aplicație mobilă la instrumentele pe care rulează întreaga ta companie.
  values_title: În ce credem
  values:
    - title: Comunicare clară
      text: Știi mereu ce se construiește, când și cât costă.
    - title: Calitate, nu scurtături
      text: Cod curat, testat și ușor de întreținut, care funcționează și după lansare.
    - title: Confidențialitate din proiectare
      text: Colectăm cât mai puține date și construim la fel pentru clienții noștri.
    - title: Parteneriate pe termen lung
      text: Preferăm să fim echipa pe care o suni pentru următorul proiect, nu un furnizor ocazional.

